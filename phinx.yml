paths:
    migrations: "database/migrations"
    seeds: "database/seeds"

environments:
    default_migration_table: phinxlog
    default_environment: development

    # Nilai default mengikuti kredensial bawaan Laragon (lihat inisialisasi_projek.md).
    # Ubah langsung di sini jika environment Anda berbeda (host/nama DB/kredensial lain).
    development:
        adapter: mysql
        host: "127.0.0.1"
        name: "simpeg"
        user: "root"
        pass: ""
        port: "3306"
        charset: utf8mb4

version_order: creation
